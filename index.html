<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Responsive birthday cake experience. */
:root {
  --table: #10302a;
  --table-deep: #0b2420;
  --cream: #fff4e0;
  --mist: #c9dfd0;
  --cherry: #c92c49;
  --cherry-hi: #de3f5e;
  --gold: #ffd27a;
  --line: rgba(255, 244, 224, 0.26);
  --font-display: "Caprasimo", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
body {
  margin: 0;
  background-color: var(--table);
  background-image:
    repeating-linear-gradient(0deg, rgba(255, 244, 224, 0.05) 0 30px, transparent 30px 60px),
    repeating-linear-gradient(90deg, rgba(255, 244, 224, 0.05) 0 30px, transparent 30px 60px);
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100%;
  padding-block: 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app {
  max-width: 1040px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 22px;
  align-items: center;
}
@media (min-width: 860px) {
  .app { grid-template-columns: minmax(300px, 1fr) minmax(0, 560px); gap: 48px; padding-block: 24px; }
}
.copy { display: grid; gap: 16px; min-width: 0; }
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(2.2rem, 8vw, 3.7rem);
  line-height: 1.05;
  margin: 0;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.status { margin: 0; max-width: 40ch; color: var(--mist); min-height: 3.1em; }
.note { margin: 0; max-width: 40ch; display: grid; gap: 2px; overflow-wrap: anywhere; }
.note .msg { font-size: 1.1rem; }
.note .from { font-size: 0.85rem; color: var(--mist); font-weight: 600; }
.controls { display: grid; gap: 16px; }
.group { display: grid; gap: 6px; min-width: 0; }
.label {
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mist);
  font-weight: 700;
}
.hint { margin: 0; font-size: 0.88rem; color: var(--mist); }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 12px; }
.btn {
  font: inherit;
  font-weight: 700;
  min-height: 46px;
  padding: 0 20px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: transparent;
  color: var(--cream);
  cursor: pointer;
  justify-self: start;
}
.btn:hover:not(:disabled) { border-color: var(--cream); }
.btn.primary { background: var(--cherry); border-color: var(--cherry); }
.btn.primary:hover:not(:disabled) { background: var(--cherry-hi); border-color: var(--cherry-hi); }
.btn:disabled { opacity: 0.45; cursor: default; }
.seg { display: inline-flex; justify-self: start; border: 1.5px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button {
  font: inherit;
  font-weight: 700;
  min-height: 40px;
  padding: 0 20px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--cream);
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--cream); color: var(--table-deep); }
.field input {
  font: inherit;
  box-sizing: border-box;
  min-height: 46px;
  width: 100%;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: rgba(0, 0, 0, 0.22);
  color: var(--cream);
  padding: 0 14px;
}
.field input::placeholder { color: rgba(201, 223, 208, 0.7); }
details { color: var(--mist); font-size: 0.88rem; }
details summary { cursor: pointer; }
details .field { margin-top: 8px; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.stage { min-width: 0; }
body.host-view .app { max-width: 560px; min-height: min(85dvh, 760px); grid-template-columns: 1fr; }
body.host-view .stage { display: none; }
body.host-view .copy { padding: clamp(20px, 5vw, 44px); border: 1px solid var(--line); border-radius: 26px; background: rgba(0,0,0,.14); }

body.party-view .stage { display: block; }
#share { min-width: 130px; }
canvas {
  display: block;
  width: 100%;
  max-width: 560px;
  aspect-ratio: 1 / 1;
  margin-inline: auto;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
</style>

<main class="app">

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="controls" id="partyPanel" hidden>

      </div>
      <div class="group">
        <span class="label">The candles</span>
        <button class="btn primary" id="blow" type="button">Blow out candles</button>
      </div>
      <div class="group">
        <span class="label">Your hand</span>
        <div class="seg" role="group" aria-label="Tool">

          <button id="hand" type="button" aria-pressed="false">Hand</button>
        </div>
      </div>
      <div class="row">
        <button class="btn" id="again" type="button">New cake</button>
        <button class="btn" id="back" type="button" hidden>Back to setup</button>
         <button class="btn" id="share" type="button">Copy party link</button>
      </div>
    </div>

    <form class="controls" id="hostPanel" novalidate hidden>
      <div class="pair field">
        <div class="group"><label class="label" for="name">Birthday person’s name</label><input id="name" type="text" maxlength="24" placeholder="Enter their name" autocomplete="off"></div>
        <div class="group"><label class="label" for="age">Turning</label><input id="age" type="number" min="1" max="99" value="18" inputmode="numeric"></div>
      </div>
      <div class="group field"><label class="label" for="msg">A birthday message</label><input id="msg" type="text" maxlength="90" placeholder="Optional. Shown above the cake." autocomplete="off"></div>
      <div class="group field"><label class="label" for="from">From</label><input id="from" type="text" maxlength="24" placeholder="Optional. Your name." autocomplete="off"></div>
      <div class="row">
        <button class="btn primary" type="submit">Start the birthday party</button>
        
      </div>
      <p class="hint" id="formMsg" role="alert"></p>
      <div class="group" id="linkBox" hidden>
        <label class="label" for="link">Send her this link</label>
        <div class="field"><input id="link" type="text" readonly></div>
        <div class="row"><button class="btn" id="copy" type="button">Copy link</button></div>
        <p class="hint" id="copied"></p>
      </div>
      <p class="hint">You can copy a link to the personalized cake from the birthday screen. The link works once this HTML is hosted online.</p>
      <details>
        <summary>Hosting this page somewhere else?</summary>
        <div class="group field"><label class="label" for="base">Page address</label><input id="base" type="text" autocomplete="off"></div>
      </details>
    </form>
  </section>
  <section class="stage">
    <canvas id="cv" role="img" aria-label="A birthday cake on a plate. Drag the knife across it to cut slices."></canvas>
  </section>
</main>

    if (!candlesLit) {
      var since = t - blowT;
      flameS = Math.max(0, 1 - since / 0.25);
      if (since > 0.9) { var u = Math.min(1, (since - 0.9) / 0.7); candleA = 1 - u; candleLift = u * 50; }
    }
    if (songPlaying && ac) {
      var nt = ac.currentTime, lastN = -9;
      for (var i = 0; i < songNotes.length; i++) { if (songNotes[i] <= nt) lastN = songNotes[i]; else break; }
      flare = reduce ? 0 : Math.max(0, 1 - (nt - lastN) / 0.3);
      if (nt > songEnd) { songPlaying = false; songNotes = []; syncUI(); }
    } else { flare = 0; }

    var ease = Math.min(1, dt * 14);
    pieces.forEach(function (pc) {
      if (!(drag && drag.type === 'move' && drag.pc === pc && drag.moved)) {
        pc.ox += (pc.tx - pc.ox) * ease; pc.oy += (pc.ty - pc.oy) * ease;
      }
      if (pc.dying) { pc.s -= dt * 2.6; pc.a = pc.s; }
    });
    pieces = pieces.filter(function (pc) { return !(pc.dying && pc.s <= 0.08); });

    parts.forEach(function (p) {
      p.life += dt;
      if (p.t === 'c') { p.vy += 620 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
      else if (p.t === 's') { p.vy *= 0.98; p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 10; }
      else { p.vy += 800 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    });
    parts = parts.filter(function (p) { return p.life < p.max; });
    trails.forEach(function (tr) { tr.life -= dt; });
    trails = trails.filter(function (tr) { return tr.life > 0; });

    draw(t);
    renderStatus();
    requestAnimationFrame(frame);
  }

  /* ---------- start ---------- */
  var baseDefault = ARTIFACT_URL;
  try {
    if (window.top === window.self && /^https?:$/.test(location.protocol)) baseDefault = location.origin + location.pathname;
  } catch (e) {}
  $('base').value = baseDefault;
  resize();
  buildStripe();
  if (location.hash === '#setup') {
    setView('host');
  } else {
    var start = parseHash() || fromConfig();
    if (start) cfg = start;
    setView(start ? 'party' : 'host');
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv); else window.addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { buildStripe(); });
  requestAnimationFrame(frame);
})();
</script>
